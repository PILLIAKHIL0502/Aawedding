<section id="reveal" class="reveal-date" data-nav="The Date" data-te-nav="తేదీ" data-theme="dark" aria-labelledby="reveal-date-title">
  <div class="reveal-date__glow" aria-hidden="true"></div>

  <div class="reveal-date__inner">
    <header class="reveal-date__head">
      <span class="eyebrow reveal-date__eyebrow" data-te="గీకి చూడండి">Scratch to reveal</span>
      <h2 class="reveal-date__title" id="reveal-date-title" data-te="తేదీని గుర్తుంచుకోండి">Save the date</h2>
    </header>

    <div class="reveal-date__stage">
      <div class="reveal-date__shadow">
        <div class="reveal-date__ticket">
          <!-- the date, printed on the ticket underneath the foil -->
          <div class="reveal-date__face">
            <svg class="reveal-date__frame" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true" focusable="false">
              <rect x="10" y="10" width="380" height="280" rx="14" vector-effect="non-scaling-stroke"/>
            </svg>
            <span class="reveal-date__corner reveal-date__corner--tl" aria-hidden="true"></span>
            <span class="reveal-date__corner reveal-date__corner--tr" aria-hidden="true"></span>
            <span class="reveal-date__corner reveal-date__corner--bl" aria-hidden="true"></span>
            <span class="reveal-date__corner reveal-date__corner--br" aria-hidden="true"></span>

            <div class="reveal-date__main">
              <span class="reveal-date__day" data-te="ఆదివారం">Sunday</span>
              <p class="reveal-date__date" aria-label="29 November 2026" data-te-aria-label="29 నవంబర్ 2026">
                <span class="reveal-date__num" aria-hidden="true">29</span><span class="reveal-date__dot" aria-hidden="true">·</span><span class="reveal-date__num" aria-hidden="true">11</span><span class="reveal-date__dot" aria-hidden="true">·</span><span class="reveal-date__num" aria-hidden="true">2026</span>
              </p>
            </div>
            <div class="reveal-date__stub">
              <span class="reveal-date__time" data-te="ఉదయం 9:05">9:05 AM</span>
            </div>

            <!-- twinkles that bloom around the date once it is revealed -->
            <svg class="reveal-date__twinkle reveal-date__twinkle--a" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 0 11.6 8.4 20 10 11.6 11.6 10 20 8.4 11.6 0 10 8.4 8.4Z"/></svg>
            <svg class="reveal-date__twinkle reveal-date__twinkle--b" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 0 11.6 8.4 20 10 11.6 11.6 10 20 8.4 11.6 0 10 8.4 8.4Z"/></svg>
            <svg class="reveal-date__twinkle reveal-date__twinkle--c" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M10 0 11.6 8.4 20 10 11.6 11.6 10 20 8.4 11.6 0 10 8.4 8.4Z"/></svg>
          </div>

          <!-- the scratchable gold foil, painted by js/scratch.js -->
          <canvas class="reveal-date__foil" aria-hidden="true"></canvas>

          <!-- a little coin that shows how to scratch, until the first touch -->
          <span class="reveal-date__hint" aria-hidden="true">
            <svg viewBox="0 0 40 40" focusable="false">
              <circle cx="20" cy="20" r="17"/>
              <circle cx="20" cy="20" r="13"/>
              <path d="M20 11.5 21.7 18.3 28.5 20 21.7 21.7 20 28.5 18.3 21.7 11.5 20 18.3 18.3Z"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="reveal-date__after">
        <button type="button" class="btn btn--ghost reveal-date__instant">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5 13.6 10.4 20.5 12 13.6 13.6 12 20.5 10.4 13.6 3.5 12 10.4 10.4Z"/></svg>
          <span data-te="వెంటనే చూపించు">Reveal instantly</span>
        </button>
        <p class="reveal-date__msg" role="status" aria-live="polite">
          <span class="reveal-date__msg-text" data-te="తేదీ ఖరారు!">It's a date!</span>
        </p>
      </div>
    </div>
  </div>
</section>
